name: Validate Be Vui Reborn
on:
  push:
    paths:
      - 'be_vui_reborn/**'
      - '.github/workflows/validate-be-vui-reborn.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import fresh Godot project
        run: godot --headless --path be_vui_reborn --editor --quit
      - name: Run startup smoke test
        run: timeout 25s godot --headless --path be_vui_reborn --quit-after 5
