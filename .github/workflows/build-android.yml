name: Build Be Vui English Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'be_vui_english/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform and dependencies
        working-directory: be_vui_english
        run: |
          flutter create . --platforms=android,ios --project-name be_vui_english
          flutter pub get
          rm -f test/widget_test.dart analysis_options.yaml
      - name: Analyze Flutter source
        working-directory: be_vui_english
        run: flutter analyze
      - name: Build Android APK
        working-directory: be_vui_english
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeVuiEnglish-Android-APK
          path: be_vui_english/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
