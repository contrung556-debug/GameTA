name: Build Be Vui English unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'be_vui_english/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform and dependencies
        working-directory: be_vui_english
        run: |
          flutter create . --platforms=ios,android --project-name be_vui_english
          flutter pub get
          rm -f test/widget_test.dart analysis_options.yaml
      - name: Test saved rewards and progress
        working-directory: be_vui_english
        run: flutter test
      - name: Analyze source
        working-directory: be_vui_english
        run: flutter analyze --no-fatal-infos
      - name: Build iOS without signing
        working-directory: be_vui_english
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p be_vui_english/build/ios/ipa/Payload
          cp -R be_vui_english/build/ios/iphoneos/Runner.app be_vui_english/build/ios/ipa/Payload/
          cd be_vui_english/build/ios/ipa
          zip -qry BeVuiEnglish-unsigned.ipa Payload
          test -s BeVuiEnglish-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BeVuiEnglish-unsigned-IPA
          path: be_vui_english/build/ios/ipa/BeVuiEnglish-unsigned.ipa
          if-no-files-found: error
